name: Sync Local Docs to GitHub Wiki
on:
  push:
    branches: [ master ]
    paths:
      - '.wiki/**' # Triggers only when your doc folder changes

permissions:
  contents: write

jobs:
  publish-wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy Folder to Wiki
        uses: Andrew-Chen-Wang/github-wiki-action@v4
        with:
          path: .wiki
